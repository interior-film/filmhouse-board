<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 | 마스터인테리어필름</title>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="roll-header">
      <div class="brand">
        <div class="roll-mark"></div>
        <div><h1>마스터인테리어필름</h1><div class="tag mono">관리자</div></div>
      </div>
      <div class="nav-actions">
        <a class="btn" href="index.html">← 게시판</a>
        <button class="btn" id="logoutBtn" style="display:none">로그아웃</button>
      </div>
    </header>

    <div id="loginPanel" class="panel" style="max-width:360px">
      <div class="field">
        <label>관리자 이메일</label>
        <input type="email" id="adminEmail" />
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" id="adminPw" />
      </div>
      <div id="loginError" class="error-text" style="display:none"></div>
      <button class="btn primary" id="loginBtn" style="width:100%">로그인</button>
    </div>

    <div id="adminList" style="display:none">
      <div class="board-toolbar">
        <div class="count-note" id="adminCount"></div>
      </div>
      <div id="rows"></div>
    </div>
  </div>

  <!-- 문의별 상세/답변 모달 -->
  <div id="modalRoot"></div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
